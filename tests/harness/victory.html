<!doctype html>
<html lang="pl">
    <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Podgląd animacji wygranej</title>
      <style>
        html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at center,#276b4d,#0c2b22);color:#fff8e4;font:16px system-ui}
        #game-app{min-height:100dvh;position:relative;overflow:hidden}
        #game-app>p:first-of-type{position:fixed;top:14%;left:50%;transform:translateX(-50%);font-size:clamp(22px,5vw,36px);font-weight:800}
        .preview-foundation{position:fixed;top:27%;width:clamp(48px,8vw,72px);height:clamp(68px,12vw,100px);border:2px dashed #c2d7c8;border-radius:8px;display:grid;place-items:center;color:#e7d18d;font-size:34px}
        #foundation-0{left:calc(50% - 160px)}#foundation-1{left:calc(50% - 80px)}#foundation-2{left:calc(50%)}#foundation-3{left:calc(50% + 80px)}
        nav{position:fixed;z-index:950;left:12px;bottom:max(12px,env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:8px;max-width:calc(100vw - 24px)}
        nav button{min-height:44px;border:1px solid #e8d49b;border-radius:8px;background:#0c2b22;color:white;padding:8px 12px;font:inherit;font-weight:700}
        #result{position:fixed;inset:auto 0 18%;text-align:center;font-size:30px;font-weight:800}
        @media(max-width:390px){nav{left:8px;right:8px;bottom:8px;gap:5px}nav button{padding:6px 8px;font-size:14px}#foundation-0{left:calc(50% - 126px)}#foundation-1{left:calc(50% - 63px)}#foundation-2{left:calc(50%)}#foundation-3{left:calc(50% + 63px)}}
      </style>
    </head>
  <body>
    <main id="game-app">
      <p>Animacje zwycięstwa — wybierz efekt, aby go odtworzyć</p>
      <div id="foundation-0" class="preview-foundation" aria-label="Fundament trefl">♣</div><div id="foundation-1" class="preview-foundation" aria-label="Fundament karo">♦</div><div id="foundation-2" class="preview-foundation" aria-label="Fundament kier">♥</div><div id="foundation-3" class="preview-foundation" aria-label="Fundament pik">♠</div>
      <nav aria-label="Podgląd efektów">
        <button data-preview="classic-cascade">Kaskada</button>
        <button data-preview="magic-fan">Wachlarz</button>
        <button data-preview="suit-fireworks">Fajerwerki</button>
        <button data-preview="card-tornado">Tornado</button>
      </nav>
      <p id="result" hidden>Zwycięstwo!</p>
    </main>
    <script type="module" src="./victory.js"></script>
  </body>
</html>
